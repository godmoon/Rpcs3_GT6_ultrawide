# GT6 (BCAS25018) 32:9 超宽屏 —— 试验补丁集
#
# 目标：720P 基准下 32:9（等效 2560x720），真正扩大水平 FOV，不做横向拉伸。
# 机制：把 EMAIN(1.00) 里被代码引用的 1.7777778f 常量改成 3.5555556f。
#       游戏内部用变形宽银幕方式渲染（画面被压进 1280x720），
#       再由 RPCS3 勾选 GPU -> Stretch To Display Area 拉伸到 2560x720，比例才正确。
#
# PPU hash：PPU-dd7ec6f4719ae9938b2e76bed97232ffc9dbdda1
#   = 光盘版 1.00 的 EMAIN（1.05 EMAIN 是 disc-bound NPDRM，解不开，RPCS3 会回落到 1.00）
#   校验方法：游戏日志里搜 "PPU executable hash"，或用 work/ppuhash.py 计算。
#
# 用法：放进 RPCS3 的 patches 目录，右键游戏 → 管理游戏补丁 → 一次只勾一个。
#       每换一组都必须完全退出游戏再重开（常量在加载时写入内存，热改无效）。
#
# 建议顺序：TEST 0（判定常量路线是否有效）→ H → A → I → 其余。
# 详细依据见 ../工作总结.md 第 4 节地址表。

# 下面这行是补丁引擎版本，不能删，缺了整份文件会被 RPCS3 跳过。
